name: Build armv7 APK only

# 只构建手机标准版 32 位（armv7）APK，跳过其余 4 个包和 Windows 包。
# 目的：快速拿到 MD3Music-<ver>-standard-armeabi-v7a.apk，不受其它构建步骤与
#      Stability Checks 影响。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例如 v6.2.0）；留空则用当前分支 HEAD'
        required: false
        default: ''
        type: string
      upload_release:
        description: '同时附加到 GitHub Release（需要 tag 存在）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: armv7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify public tree (reject private code)
        run: |
          set -e
          if [ -d "lib/private" ]; then
            echo "::error::检测到 lib/private 私有目录，禁止构建"
            exit 1
          fi
          if grep -q "MANAGE_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "::error::AndroidManifest.xml 含 MANAGE_EXTERNAL_STORAGE 私有权限，禁止构建"
            exit 1
          fi
          if [ -f "networkapi/.env" ]; then
            echo "::error::检测到 networkapi/.env 私有配置，禁止构建"
            exit 1
          fi
          echo "公开树校验通过"

      - name: Resolve version
        id: version
        run: |
          set -e
          RAW=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//')
          VERSION=${RAW%%+*}
          CODE=${RAW##*+}
          [ "$CODE" = "$RAW" ] && CODE=1
          echo "tag=${{ inputs.tag }}"      >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE"         >> "$GITHUB_OUTPUT"
          echo "full_version=${VERSION}+${CODE}" >> "$GITHUB_OUTPUT"
          echo "解析结果: version=$VERSION versionCode=$CODE (pubspec: $RAW)"

      - name: Update pubspec.yaml version
        run: |
          set -e
          sed -i.bak -E "s/^version:.*/version: ${{ steps.version.outputs.full_version }}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep -E '^(name|version):' pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-armv7-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-armv7-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Verify native libraries
        run: |
          echo "jniLibs/:"
          ls -lh android/app/src/main/jniLibs/*/libkugou_server.so 2>/dev/null \
            || echo "  WARNING: libkugou_server.so not found"

      - name: Download release keystore
        id: keystore
        continue-on-error: true
        run: |
          set -e
          if curl -fL --retry 3 -o /tmp/release.keystore \
              "https://github.com/${{ github.repository }}/releases/download/keystore/release.keystore"; then
            cp /tmp/release.keystore android/app/release.keystore
            rm -f /tmp/release.keystore
            echo "keystore_available=true" >> "$GITHUB_OUTPUT"
            ls -lh android/app/release.keystore
          else
            echo "WARN: keystore release 不存在，使用 debug keystore 兜底"
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate keystore.properties
        if: steps.keystore.outputs.keystore_available == 'true'
        run: |
          set -e
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyPassword=${KEY_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          storeFile=release.keystore
          EOF
          cat android/keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build APK (standard, armeabi-v7a, Skia)
        run: |
          set -e
          flutter build apk --release --flavor standard --split-per-abi \
            --target-platform android-arm \
            --android-project-arg=md3EnableImpeller=false \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.versionCode }}

      - name: Rename and verify APK
        id: apk
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ver="${{ steps.version.outputs.version }}"
          src="$apk_dir/app-armeabi-v7a-standard-release.apk"
          test -f "$src" || { echo "::error::构建产物不存在: $src"; ls -lh "$apk_dir"/; exit 1; }
          out="$apk_dir/MD3Music-${ver}-standard-armeabi-v7a.apk"
          mv "$src" "$out"

          echo "=== 产物 ==="
          ls -lh "$out"

          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo ""
          echo "=== 校验 ==="
          "$aapt2" dump badging "$out" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | sed 's/^/  包名: /'
          "$aapt2" dump badging "$out" | sed -n 's/^native-code: //p' | sed 's/^/  ABI:  /'

          # ABI 必须只含 armeabi-v7a
          abi=$("$aapt2" dump badging "$out" | sed -n 's/^native-code: //p')
          if echo "$abi" | grep -q "armeabi-v7a" && ! echo "$abi" | grep -q "arm64"; then
            echo "  ✓ ABI 校验通过"
          else
            echo "::error::ABI 不符，期望仅 armeabi-v7a，实际: $abi"
            exit 1
          fi

          # 包名必须是 com.md3music.md3music（不能是 .tv）
          pkg=$("$aapt2" dump badging "$out" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ "$pkg" = "com.md3music.md3music" ]; then
            echo "  ✓ 包名校验通过"
          else
            echo "::error::包名不符，期望 com.md3music.md3music，实际: $pkg"
            exit 1
          fi

          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD3Music-armv7-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        if: inputs.upload_release && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          append: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## armv7 APK 构建完成"
            echo ""
            echo "- 版本: \`${{ steps.version.outputs.full_version }}\`"
            echo "- 文件: \`${{ steps.apk.outputs.name }}\`"
            echo "- 大小: $(du -h "${{ steps.apk.outputs.path }}" | cut -f1)"
            echo ""
            echo "在本次 run 页面底部的 **Artifacts** 区域下载。"
          } >> "$GITHUB_STEP_SUMMARY"
